name: Build Gallery APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build test APK
        run: gradle :app:assembleDebug :app:testDebugUnitTest
      - name: Verify APK signature and checksum
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -print -quit)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: IING-STD-Gallery-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Android Lint quality gate
        run: gradle :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Gallery-Quality-Reports
          path: app/build/reports/
          if-no-files-found: ignore
      - name: Publish version 1.0 final
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0 >/dev/null 2>&1; then
            echo "Version 1.0 already published"
            exit 0
          fi
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -print -quit)
          cp "$APK" IING-STD-Gallery-v1.0.apk
          sha256sum IING-STD-Gallery-v1.0.apk > SHA256SUMS.txt
          gh release create v1.0 IING-STD-Gallery-v1.0.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "IING STD Gallery v1.0 Final" --notes "Final feature build. Debug-signed APK; device testing of the newest features remains necessary."
